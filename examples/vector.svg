<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260">
<title>A rightward vector</title><desc>An arrow from (80,160) to (360,160).</desc>
<rect width="480" height="260" fill="white"/>
<line x1="80" y1="160" x2="360" y2="160" stroke="#1f2937" stroke-width="4"/>
<polygon points="360,160 340,150 340,170" fill="#1f2937"/>
<circle cx="80" cy="160" r="5" fill="#1f2937"/>
<text x="65" y="200" font-family="sans-serif" font-size="24">origin</text>
<text x="210" y="130" font-family="sans-serif" font-size="24">vector</text>
</svg>
